# CLEAR / CLAIMARC paper-canonical hyperparameters (sources_only fair protocol)
evidence_policy: sources_only
encoder: BAAI/bge-large-zh-v1.5
enc_train: full
lr: 1.0e-5
lr_head: 1.0e-4
tau: 0.07
lambda_cl: 0.5
Kp: 3
Kn: 5
loss: bce
warmup_epochs: 3
cl_epochs: 6
batch_size: 12
grad_accum: 3
cl_no_attr_block: true
cl_class_balanced: true
seeds: [0, 1, 2]
dataset: data/dataset_duallabel_FULLPOOL_PLUS_OBJNEG_supervised_20260615.jsonl
split: room_id grouped 70/10/20
notes: >
  All paper tables use the same supervised jsonl and three-source evidence
  (evidence_params + evidence_ocr + evidence_vlm). LLM arguments are not used.
