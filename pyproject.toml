[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimarc"
version = "1.0.0"
description = "Reviewer reproduction package for arguments-only CLAIMARC experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["zstandard>=0.23"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "run_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
